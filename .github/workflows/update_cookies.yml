name: Update Leetcode Cookies

on:
  schedule:
    - cron: "0 0 * * 0" # Runs automatically every 7 days
  workflow_dispatch:      # Allows you to trigger it manually if needed

permissions:
  contents: write

jobs:
  update_cookies:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch LeetCode cookies and refresh session
        uses: wustep/leetcode-signin@v1
        with:
          username: ${{ secrets.LEETCODE_EMAIL }}
          password: ${{ secrets.LEETCODE_PASSWORD }}
          # This automatically keeps your GITHUB_TOKEN updated with your fresh cookies
          github-token: ${{ secrets.GITHUB_TOKEN }} 
